name: Zeytin & Meyve Bahçesi AI Kontrolü

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Python 3.10 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Bağımlılıkların Kurulması
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Sözdizimi (Syntax) Kontrolü
      run: |
        python -m py_compile streamlit_app.py app/prototype/app.py app/prototype/analyze.py scripts/download_inaturalist.py scripts/check_dataset.py scripts/prepare_data.py
